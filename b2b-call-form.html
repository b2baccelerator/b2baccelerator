<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Notes - B2B Accelerator</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-white: #ffffff;
            --bg-light: #f8fafc;
            --bg-subtle: #f1f5f9;
            --card-white: #ffffff;
            --accent-blue: #2563eb;
            --accent-blue-dark: #1d4ed8;
            --accent-blue-light: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --text-dark: #0f172a;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --success-green: #059669;
            --success-bg: #ecfdf5;
            --warning-red: #dc2626;
            --warning-bg: #fef2f2;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(180deg, var(--bg-light) 0%, var(--primary-white) 50%, var(--bg-light) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        @media (min-width: 768px) {
            .container {
                padding: 60px 24px;
            }
        }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0 40px;
        }

        .logo-img {
            height: 60px;
            width: auto;
            max-width: 240px;
            object-fit: contain;
        }

        @media (min-width: 768px) {
            .logo-img {
                height: 70px;
                max-width: 280px;
            }
        }

        /* Form Card */
        .form-card {
            background: var(--card-white);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-xl);
            padding: 32px 24px;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .form-card {
                border-radius: 24px;
                padding: 48px 40px;
            }
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent-gradient);
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 32px;
        }

        @media (min-width: 768px) {
            .form-title {
                font-size: 28px;
                margin-bottom: 40px;
            }
        }

        /* Call Type Selector */
        .call-type-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        @media (min-width: 768px) {
            .call-type-selector {
                gap: 16px;
            }
        }

        .call-type-btn {
            flex: 1;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .call-type-btn {
                padding: 16px 24px;
                font-size: 16px;
            }
        }

        .call-type-btn:hover {
            border-color: var(--accent-blue-light);
            color: var(--accent-blue);
            background: var(--primary-white);
        }

        .call-type-btn.active {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(29, 78, 216, 0.05) 100%);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Form Sections */
        .form-section {
            margin-bottom: 28px;
        }

        @media (min-width: 768px) {
            .form-section {
                margin-bottom: 32px;
            }
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (min-width: 768px) {
            .section-title {
                font-size: 15px;
                margin-bottom: 20px;
            }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        @media (min-width: 768px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-bottom: 20px;
            }
        }

        .form-row.single {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-label .required {
            color: var(--warning-red);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-dark);
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--text-subtle);
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--accent-blue);
            background: var(--primary-white);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-textarea.large {
            min-height: 180px;
        }

        /* Option Buttons (Show/No-Show, Qualified/Not Qualified) */
        .option-buttons {
            display: flex;
            gap: 12px;
        }

        .option-btn {
            flex: 1;
        }

        .option-btn input {
            display: none;
        }

        .option-btn label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn label:hover {
            border-color: var(--accent-blue-light);
            color: var(--text-primary);
        }

        .option-btn input:checked + label {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(29, 78, 216, 0.05) 100%);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Show option - green when selected */
        .option-btn.show-option input:checked + label {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.1) 0%, rgba(5, 150, 105, 0.05) 100%);
            border-color: var(--success-green);
            color: var(--success-green);
        }

        /* No-Show option - red when selected */
        .option-btn.noshow-option input:checked + label {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.1) 0%, rgba(220, 38, 38, 0.05) 100%);
            border-color: var(--warning-red);
            color: var(--warning-red);
        }

        /* Qualified option - green when selected */
        .option-btn.qualified-option input:checked + label {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.1) 0%, rgba(5, 150, 105, 0.05) 100%);
            border-color: var(--success-green);
            color: var(--success-green);
        }

        /* Not Qualified option - red when selected */
        .option-btn.notqualified-option input:checked + label {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.1) 0%, rgba(220, 38, 38, 0.05) 100%);
            border-color: var(--warning-red);
            color: var(--warning-red);
        }

        .option-icon {
            width: 20px;
            height: 20px;
        }

        /* Conditional Content */
        .call-content {
            display: none;
            animation: slideDown 0.3s ease;
        }

        .call-content.active {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent-gradient);
            color: var(--primary-white);
            padding: 18px 32px;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .submit-btn.loading .spinner {
            display: inline-block;
        }

        .submit-btn.loading .btn-icon {
            display: none;
        }

        /* Messages */
        .form-message {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            display: none;
            text-align: center;
        }

        .form-message.success {
            background: var(--success-bg);
            border: 1px solid var(--success-green);
            color: var(--success-green);
            display: block;
        }

        .form-message.error {
            background: var(--warning-bg);
            border: 1px solid var(--warning-red);
            color: var(--warning-red);
            display: block;
        }

        /* Setter/Closer Specific Fields */
        .setter-fields,
        .closer-fields {
            display: none;
        }

        .setter-fields.active,
        .closer-fields.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .call-type-selector {
                flex-direction: column;
            }

            .option-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="logo.png" alt="B2B Accelerator" class="logo-img">
        </header>

        <div class="form-card">
            <h1 class="form-title">Call Notes <span class="gradient-text">B2B Accelerator</span></h1>

            <form id="callNotesForm">
                <!-- Call Type Selector -->
                <div class="call-type-selector">
                    <button type="button" class="call-type-btn active" data-type="setter">
                        Setter Call
                    </button>
                    <button type="button" class="call-type-btn" data-type="closer">
                        Closer Call
                    </button>
                </div>

                <!-- Lead Info Section (Always Visible) -->
                <div class="form-section">
                    <h2 class="section-title">Lead Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Lead E-Mail <span class="required">*</span></label>
                            <input type="email" class="form-input" id="leadEmail" placeholder="email@beispiel.de" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Lead Name</label>
                            <input type="text" class="form-input" id="leadName" placeholder="Vor- und Nachname">
                        </div>
                    </div>
                </div>

                <!-- ==================== SETTER CALL FIELDS ==================== -->
                <div class="setter-fields active">
                    
                    <!-- Show/No-Show Selector -->
                    <div class="form-section">
                        <h2 class="section-title">Teilnahme</h2>
                        <div class="form-row single">
                            <div class="form-group">
                                <div class="option-buttons">
                                    <div class="option-btn show-option">
                                        <input type="radio" name="setter_attendance" id="setter_show" value="Show" checked>
                                        <label for="setter_show">
                                            <svg class="option-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                            Show
                                        </label>
                                    </div>
                                    <div class="option-btn noshow-option">
                                        <input type="radio" name="setter_attendance" id="setter_noshow" value="No-Show">
                                        <label for="setter_noshow">
                                            <svg class="option-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                            No-Show
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Setter Call Content (hidden when No-Show) -->
                    <div class="call-content active" id="setterCallContent">
                        
                        <!-- Qualified/Not Qualified -->
                        <div class="form-section">
                            <h2 class="section-title">Qualifikation</h2>
                            <div class="form-row single">
                                <div class="form-group">
                                    <div class="option-buttons">
                                        <div class="option-btn qualified-option">
                                            <input type="radio" name="setter_qualified" id="setter_qualified_yes" value="Qualified" checked>
                                            <label for="setter_qualified_yes">
                                                <svg class="option-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                                Qualifiziert
                                            </label>
                                        </div>
                                        <div class="option-btn notqualified-option">
                                            <input type="radio" name="setter_qualified" id="setter_qualified_no" value="Not Qualified">
                                            <label for="setter_qualified_no">
                                                <svg class="option-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                                            Nicht Qualifiziert
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="form-section">
                            <h2 class="section-title">Notizen</h2>
                            <div class="form-row single">
                                <div class="form-group">
                                    <label class="form-label">Beschreibung / Zusammenfassung</label>
                                    <textarea class="form-textarea large" id="setterDescription" placeholder="Beschreiben Sie den Call, wichtige Punkte, Erkenntnisse über den Lead..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ==================== CLOSER CALL FIELDS ==================== -->
                <div class="closer-fields">
                    
                    <!-- Show/No-Show Selector -->
                    <div class="form-section">
                        <h2 class="section-title">Teilnahme</h2>
                        <div class="form-row single">
                            <div class="form-group">
                                <div class="option-buttons">
                                    <div class="option-btn show-option">
                                        <input type="radio" name="closer_attendance" id="closer_show" value="Show" checked>
                                        <label for="closer_show">
                                            <svg class="option-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                            Show
                                        </label>
                                    </div>
                                    <div class="option-btn noshow-option">
                                        <input type="radio" name="closer_attendance" id="closer_noshow" value="No-Show">
                                        <label for="closer_noshow">
                                            <svg class="option-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                            No-Show
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Closer Call Content (hidden when No-Show) -->
                    <div class="call-content active" id="closerCallContent">
                        
                        <!-- Qualified/Not Qualified -->
                        <div class="form-section">
                            <h2 class="section-title">Qualifikation</h2>
                            <div class="form-row single">
                                <div class="form-group">
                                    <div class="option-buttons">
                                        <div class="option-btn qualified-option">
                                            <input type="radio" name="closer_qualified" id="closer_qualified_yes" value="Qualified" checked>
                                            <label for="closer_qualified_yes">
                                                <svg class="option-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                                Qualifiziert
                                            </label>
                                        </div>
                                        <div class="option-btn notqualified-option">
                                            <input type="radio" name="closer_qualified" id="closer_qualified_no" value="Not Qualified">
                                            <label for="closer_qualified_no">
                                                <svg class="option-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                                                Nicht Qualifiziert
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="form-section">
                            <h2 class="section-title">Notizen</h2>
                            <div class="form-row single">
                                <div class="form-group">
                                    <label class="form-label">Beschreibung / Zusammenfassung</label>
                                    <textarea class="form-textarea large" id="closerDescription" placeholder="Beschreiben Sie den Call, Ergebnis, nächste Schritte, Deal-Details..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Notizen speichern</span>
                    <span class="spinner"></span>
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>

                <!-- Form Message -->
                <div class="form-message" id="formMessage"></div>
            </form>
        </div>
    </div>

    <script>
        // ========== CONFIGURATION ==========
        // Replace with your actual Zapier webhook URL
        const ZAPIER_WEBHOOK_URL = 'https://hooks.zapier.com/hooks/catch/312787/uq9afr0/';

        // ========== DOM ELEMENTS ==========
        const form = document.getElementById('callNotesForm');
        const submitButton = document.getElementById('submitBtn');
        const formMessage = document.getElementById('formMessage');
        const callTypeBtns = document.querySelectorAll('.call-type-btn');
        const setterFields = document.querySelector('.setter-fields');
        const closerFields = document.querySelector('.closer-fields');
        const setterCallContent = document.getElementById('setterCallContent');
        const closerCallContent = document.getElementById('closerCallContent');

        let currentCallType = 'setter';

        // ========== SHOW/NO-SHOW TOGGLE ==========
        // Setter attendance toggle
        const setterAttendanceRadios = document.querySelectorAll('input[name="setter_attendance"]');
        setterAttendanceRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.value === 'No-Show' && radio.checked) {
                    setterCallContent.classList.remove('active');
                } else if (radio.checked) {
                    setterCallContent.classList.add('active');
                }
            });
        });

        // Closer attendance toggle
        const closerAttendanceRadios = document.querySelectorAll('input[name="closer_attendance"]');
        closerAttendanceRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.value === 'No-Show' && radio.checked) {
                    closerCallContent.classList.remove('active');
                } else if (radio.checked) {
                    closerCallContent.classList.add('active');
                }
            });
        });

        // ========== CALL TYPE TOGGLE ==========
        callTypeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update button states
                callTypeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Toggle field visibility
                currentCallType = btn.dataset.type;
                
                if (currentCallType === 'setter') {
                    setterFields.classList.add('active');
                    closerFields.classList.remove('active');
                } else {
                    setterFields.classList.remove('active');
                    closerFields.classList.add('active');
                }
            });
        });

        // ========== FORM SUBMISSION ==========
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const leadEmail = document.getElementById('leadEmail').value.trim();

            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(leadEmail)) {
                showMessage('Bitte geben Sie eine gültige E-Mail-Adresse ein.', 'error');
                return;
            }

            // Show loading state
            submitButton.classList.add('loading');
            submitButton.disabled = true;
            formMessage.style.display = 'none';

            try {
                // Collect form data
                const formData = new FormData();
                
                // Common fields
                formData.append('call_type', currentCallType);
                formData.append('lead_email', leadEmail);
                formData.append('lead_name', document.getElementById('leadName').value.trim());
                formData.append('timestamp', new Date().toISOString());
                formData.append('source', 'b2b-accelerator-call-form');

                if (currentCallType === 'setter') {
                    // Setter Call specific fields
                    const attendance = document.querySelector('input[name="setter_attendance"]:checked');
                    formData.append('attendance', attendance ? attendance.value : '');
                    
                    // Only include other fields if it's a Show
                    if (attendance && attendance.value === 'Show') {
                        const qualified = document.querySelector('input[name="setter_qualified"]:checked');
                        formData.append('qualified', qualified ? qualified.value : '');
                        formData.append('description', document.getElementById('setterDescription').value.trim());
                    }
                } else {
                    // Closer Call specific fields
                    const attendance = document.querySelector('input[name="closer_attendance"]:checked');
                    formData.append('attendance', attendance ? attendance.value : '');
                    
                    // Only include other fields if it's a Show
                    if (attendance && attendance.value === 'Show') {
                        const qualified = document.querySelector('input[name="closer_qualified"]:checked');
                        formData.append('qualified', qualified ? qualified.value : '');
                        formData.append('description', document.getElementById('closerDescription').value.trim());
                    }
                }

                // Convert FormData to URLSearchParams for better Zapier compatibility
                const urlParams = new URLSearchParams();
                for (const [key, value] of formData.entries()) {
                    urlParams.append(key, value);
                }

                const response = await fetch(ZAPIER_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: urlParams.toString()
                });

                // With mode: 'no-cors', we can't read the response, but if no error was thrown, assume success
                showMessage('✓ Notizen erfolgreich gespeichert!', 'success');
                
                // Reset form after successful submission
                form.reset();
                callTypeBtns[0].click(); // Reset to Setter
                setterCallContent.classList.add('active');
                closerCallContent.classList.add('active');
            } catch (error) {
                console.error('Submission error:', error);
                showMessage('Fehler beim Speichern. Bitte versuchen Sie es erneut.', 'error');
            } finally {
                submitButton.classList.remove('loading');
                submitButton.disabled = false;
            }
        });

        // ========== HELPER FUNCTIONS ==========
        function showMessage(text, type) {
            formMessage.textContent = text;
            formMessage.className = `form-message ${type}`;
            formMessage.style.display = 'block';

            if (type === 'error') {
                setTimeout(() => {
                    formMessage.style.display = 'none';
                }, 5000);
            }
        }

        // Clear messages on input
        document.getElementById('leadEmail').addEventListener('input', () => {
            formMessage.style.display = 'none';
        });
    </script>
</body>
</html>
